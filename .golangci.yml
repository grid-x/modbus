version: "2"
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - staticcheck
    - gocritic
    - gosec
    - govet
    - revive
  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
